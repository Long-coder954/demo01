<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day07 CSS入门</title>
    <!--2.内部样式表-->
    <style>
      h2 {
        color: #2980b9;
        font: size 28px;
      }
      .text-demo {
        color: #444;
        font: size 18px;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <!--1.行内样式-->
    <p style="color: red; font-size: 20px">这是行内样式，直接写在标签上</p>

    <h2>内部样式演示</h2>
    <p class="text-demo">
      CSS层叠样式表，用来美化网页，控制颜色、字号、间距、布局。
    </p>
  </body>
</html>
